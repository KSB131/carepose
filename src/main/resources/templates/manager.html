<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 대시보드</title>
<!-- Bootstrap 5 CSS -->
<link
   href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
   rel="stylesheet" />
<link rel="stylesheet"
   href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<!-- Custrom CSS (Optional, keeping if needed for specific overrides) -->
<link rel="stylesheet" th:href="@{/css/style.css}" />

<style>
	/* 1. 테이블 전체 글자 크기 조절 */
   .table { font-size: 1.5rem; } 
   .table thead th { font-size: 2rem; padding: 15px; }
   
   body {
  margin: 0;
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  background: var(--gradient-main);
  min-height: 100vh;
  color: var(--text-primary);
  display: block !important;
  min-height: 100vh;
}

body {
  background-color: var(--bg-soft-gray) !important;
  font-family: 'Pretendard', -apple-system, sans-serif;
}
   
main {
    /* 사이드바(col-md-3)를 제외한 나머지 공간을 완벽히 차지하게 합니다 */
    width: 100%;
    padding: 40px 50px !important;
    background-color: transparent !important;
    /* 왼쪽 쏠림 방지: Bootstrap 클래스와 충돌하지 않도록 보정 */
    margin-left: auto;
}  
 
.main-layout {

  min-height: 100vh;
  width: 100%;
}

.main-wrapper {

  align-items: flex-start;
  width: 100%;
  min-height: 100vh;
}

.content-area {
  flex-grow: 1;
  padding: 20px;
  overflow-x: hidden;
}
   
main,
.main-content {

  padding: 40px 50px;
  overflow: auto;
}

.container-fluid {
    width: 100%;
}
   
   
.card {
  background: var(--gradient-card);
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(100, 148, 237, 0.08);
  padding: 32px;
  margin-bottom: 24px;
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.card-title {
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 24px;
  font-size: 24px;
}

   /* 2. 승인/삭제 버튼 크기 및 텍스트 조절 */
   .btn-custom-size {
      font-size: 1.5rem !important; /* 글자 크기: 여기서 수치를 바꾸세요 (예: 1.2rem) */
      padding: 8px 20px !important; /* 버튼 안쪽 여백: (상하 10px, 좌우 25px) */
      min-width: 30px; /* 버튼의 최소 가로 길이 */
      max-width: 120px;
      transition: all 0.2s;         /* 마우스 올렸을 때 부드러운 효과 */
   }

   /* 3. 승인 대기 명단 제목 및 배지 크기 */
   .card-header h5 { font-size: 1.4rem; }
   .badge { font-size: 1.5rem; padding: 8px 12px; }
   
   /* 승인 버튼 마우스 올렸을 때 더 진하게 */
   .btn-approve:hover {
      background-color: #0d47a1 !important; 
      transform: translateY(-1px); /* 살짝 위로 뜨는 효과 */
   }

   /* 삭제 버튼 마우스 올렸을 때 채워지는 빨간색 */
   .btn-delete:hover {
      background-color: #dc3545 !important;
      color: white !important;
   }
   
   .input-group-text {
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
   }
   
   #roleSearchInput {
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
   }
   
   /* 요양보호사, 간호사 박스 */
   .bg-info-subtle { background-color: #e0f2fe !important; color: #0369a1 !important; }
   .bg-success-subtle { background-color: #dcfce7 !important; color: #15803d !important; }
   
   
   /* 테이블 컨테이너 */
.modern-table {
    width: 100% !important;
    table-layout: fixed; /* 열 너비를 일정하게 유지하면서 꽉 채움 */
    border-collapse: collapse;
}   
   
.modern-table-container {
    background: #ffffff;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.03); /* 아주 연한 그림자 */
    overflow: hidden;
}


/* 브래킷 제거 (사진에는 브래킷이 없으므로 투명 처리) */
.modern-table-container::before, .modern-table-container::after {
    display: none;
}

/* 3. 테이블 헤더: 사진의 핵심인 '연한 하늘색' 배경 */
.modern-table thead {
    background-color: #94a3b8 !important; 
    border-bottom: 2px solid #cbd5e1;
}

.modern-table thead th {
    padding: 18px 20px;
    font-size: 22px;
    font-weight: 800;
    color: #ffffff !important;/* 차분한 네이비 그레이 */
    text-transform: none;
    letter-spacing: 0;
    text-align: center; /* 전체 중앙 정렬로 깔끔하게 */
}

/* 4. 테이블 본문 */
.modern-table tbody tr {
    border-bottom: 1px solid #f1f5f9;
    background: #fff;
    text-align: center; /* 전체 중앙 정렬로 깔끔하게 */
}

.modern-table tbody tr:hover {
    background-color: #f8fafc; /* 마우스 올렸을 때 살짝 변함 */
}

.modern-table tbody td {
    font-size: 20px;
    padding: 16px 20px;
    color: #334155 !important;
    vertical-align: middle;
}

/* 5. 사용자명(ID) 열: 사진처럼 일반 텍스트 느낌 (파란색 제거) */
.modern-table tbody td:first-child {
    font-weight: 500 !important;
    color: #1e293b !important;
    font-family: inherit;
}

/* --- 4. 배지 스타일 (중요: 누락되었던 부분) --- */
.badge-nurse {
    background: #f0f9ff;
    border: 1px solid #0ea5e9;
    color: #0ea5e9;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 20px;
}

.badge-caregiver {
    background: #f0fdf4;
    border: 1px solid #22c55e;
    color: #22c55e;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 20px;
}

.badge-manager {
    background: #f8fafc;
    border: 1px solid #64748b;
    color: #64748b;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 20px;
}

/* --- 버튼 스타일 (사진의 수정/삭제 버튼 느낌) --- */
.btn-custom-size {
    padding: 8px 18px !important;
    font-weight: 600;
    border-radius: 8px !important;
}

.btn-approve {
    background: #ffffff !important;
    border: 1px solid #0ea5e9 !important;
    color: #0ea5e9 !important;
}

.btn-approve:hover {
    background: #0ea5e9 !important;
    color: #fff !important;
}

.btn-delete {
    background: #ffffff !important;
    border: 1px solid #f43f5e !important;
    color: #f43f5e !important;
}

.btn-delete:hover {
    background: #f43f5e !important;
    color: #fff !important;
}

</style>

</head>
<body class="bg-light">
  <div class="container-fluid">
      <div class="row">
         <!-- Sidebar -->
         <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-0">
            <div class="position-sticky">
               <div class="sidebar-logo">
               		<img src="/css/logo.png" alt="SMHRD 요양병원 로고">
                  <div class="sidebar-title">SMHRD 요양병원</div>
                  <div class="sidebar-subtitle">안전 관제시스템</div>
               </div>
               <ul class="nav flex-column px-3">
                  <li class="nav-item"><a class="nav-link"
                     th:href="@{/dashboard}"
                     th:classappend="${requestURI.contains('/dashboard')} ? 'active'">
                        <i class="bi bi-speedometer2 me-2"></i>대시보드
                  </a></li>
                  <li class="nav-item"><a class="nav-link"
                     th:href="@{/patients}"
                     th:classappend="${requestURI.contains('/patients')} ? 'active'">
                        <i class="bi bi-hospital me-2"></i>침상 관리
                  </a></li>
                  <li class="nav-item"><a class="nav-link" th:href="@{/rooms}"
                     th:classappend="${requestURI.contains('/rooms')} ? 'active'">
                        <i class="bi bi-camera-video me-2"></i>실시간 모니터링
                  </a></li>
                  <li class="nav-item"><a class="nav-link" th:href="@{alerts}"
                     th:classappend="${requestURI.contains('/alerts')} ? 'active'">
                        <i class="bi bi-bell me-2"></i>알림 센터
                  </a></li>
                  <li class="nav-item"
                  	  th:if="${session.role == 'manager'}">
                  	  <a class="nav-link" th:href="@{/manager}"
                     th:classappend="${requestURI.contains('/manager')} ? 'active'">
                        <i class="bi bi-people-fill me-2"></i>관리자
                  </a></li>
                  <li class="nav-item">
    <a class="nav-link text-danger" th:href="@{/logout}">
        <i class="bi bi-box-arrow-right me-2"></i>로그아웃
    </a>
</li>
               </ul>
               <div class="mt-5 px-3">
                  <span class="small text-muted" style="color: silver !important">carepose
                     1.0.0</span>
               </div>
            </div>
         </nav>
         
         <!-- Main Content -->
         <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="page-header d-flex align-items-center">
               <div>
                  <h1 class="page-title mb-1">관리자 대시보드</h1>
                  <p class="text-muted mb-0">직원 승인/삭제</p>
               </div>
            </div>
            
            <!-- Alerts Section -->
       
                     <div class="card-body p-0">
                        <!-- 승인대기명단 박스 -->
                        <div class="row">
						   <div class="col-12"> 
						     <div class="card shadow-sm mb-4">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0 text-secondary">
            <i class="bi bi-person-check me-2"></i>승인 대기 명단
            <span class="badge bg-warning text-dark ms-2" th:text="${#lists.size(pendingMembers)}">0</span>
        </h5>
    </div>
    
    
						         
						         <div class="card-body p-0">
						         	
						         
						            <div class="modern-table-container">
   									   
						            </div>
						         </div>
						      </div>
						   </div>
						</div>
                     </div>

<div class="card-body p-0">
    <div class="search-card">
    <div class="search-input-group">
        <i class="bi bi-search search-icon"></i>
        <input
            type="text"
            id="roleSearchInput"
            class="w-100"
            placeholder="ID/권한 입력 (예: qwe, 요양보호사)..."
        />
    </div>
</div>
				            
						         </div>

<table class="modern-table">
						                  <thead>
						                     <tr>
						                        <th class="ps-4">사용자명(ID)</th>
						                        <th>신청 권한</th>
						                        <th class="text-center">작업</th>
						                     </tr>
						                  </thead>
						                  <tbody>
						                     <tr th:each="member : ${pendingMembers}">
   <td class="ps-4">
      <span th:text="${member.username}">username</span>
   </td>
   <td>
      <span th:if="${member.roomAuthority == 'nurse'}" class="badge-nurse">간호사</span>
      <span th:if="${member.roomAuthority == 'caregiver'}" class="badge-caregiver">요양보호사</span>
      <span th:if="${member.roomAuthority == 'manager'}" class="badge-manager">관리자</span>
   </td>
   <td class="text-center">
      <div class="d-flex justify-content-center gap-2">
         <button type="button" class="btn btn-approve btn-custom-size" 
                 th:data-username="${member.username}" 
                 th:data-auth="${member.roomAuthority}">
             <i class="bi bi-check-lg"></i> 승인
         </button>
         <button type="button" class="btn btn-delete btn-custom-size" 
                 th:data-username="${member.username}">
             <i class="bi bi-trash"></i> 삭제
         </button>
      </div>
   </td>
</tr>
						                     <tr th:if="${#lists.isEmpty(pendingMembers)}">
						                        <td colspan="3" class="text-center py-5 text-muted">
						                           승인 대기 중인 인원이 없습니다.
						                        </td>
						                     </tr>
						                  </tbody>
						               </table>
         </main>
         
    </div>
  </div>
  
  <script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', function() {
	    
	    // 1. 키보드 검색 필터 로직
	    const searchInput = document.getElementById('roleSearchInput');
	    
	    // 입력할 때마다 이벤트 발생
	    searchInput.addEventListener('keyup', function() {
	        const filterValue = this.value.toLowerCase().trim();
	        // tbody 안의 모든 tr을 매번 새로 가져와야 정확합니다.
	        const tableRows = document.querySelectorAll('tbody tr');

	        tableRows.forEach(row => {
	            // "승인 대기 중인 인원이 없습니다" 메시지 행은 검색에서 제외
	            if (row.cells.length < 2) return; 

	            const rowText = row.textContent.toLowerCase();
	            if (rowText.includes(filterValue)) {
	                row.style.setProperty('display', '', 'important'); // 보임
	            } else {
	                row.style.setProperty('display', 'none', 'important'); // 숨김
	            }
	        });
	    });

	    // 2. 승인 버튼 이벤트 리스너
	    document.querySelectorAll('.btn-approve').forEach(button => {
	        button.addEventListener('click', function() {
	            const username = this.getAttribute('data-username');
	            const auth = this.getAttribute('data-auth');
	            let authName = "";
	            if(auth === 'nurse') authName = "간호사";
	            else if(auth === 'caregiver') authName = "요양보호사";
	            else if(auth === 'manager') authName = "관리자";
	            
	            if(confirm(username + " 사용자를 " + authName + "(으)로 승인하시겠습니까?")) {
	                location.href = "/manager/approve?username=" + username + "&role=" + auth;
	            }
	        });
	    });

	    // 3. 삭제 버튼 이벤트 리스너
	    document.querySelectorAll('.btn-delete').forEach(button => {
	        button.addEventListener('click', function() {
	            const username = this.getAttribute('data-username');
	            
	            if(confirm(username + " 사용자를 삭제하시겠습니까?")) {
	                location.href = "/manager/delete?username=" + username;
	            }
	        });
	    });
	});
</script>

</body>
</html>
